spring:
  application:
    name: rest-adapter
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: rest-adapter
