services:

  # Consul for Service Discovery (for called-ejb and called-web)
  consul:
    image: hashicorp/consul:1.15
    container_name: soa-consul
    ports:
      - '8500:8500'
      - '8600:8600/udp'
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Eureka Service Discovery (for Spring Cloud services)
  eureka-server:
    build: eureka-server
    container_name: soa-eureka-server
    ports:
      - '8761:8761'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Cloud Config Server
  config-server:
    build: config-server
    container_name: soa-config-server
    ports:
      - '8888:8888'
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # EJB container with business logic
  called-ejb:
    build:
      context: .
      dockerfile: called-ejb/Dockerfile
    ports:
      - '8446:8443'
      - '9992:9990'
      - '8081:8080'
    environment:
      EJB_POOL_MAX: ${EJB_POOL_MAX:-50}
      JAVA_OPTS_APPEND: >
        -Djavax.net.ssl.trustStore=/opt/jboss/wildfly/standalone/configuration/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
        -Dejb.pool.max=${EJB_POOL_MAX:-50}
    container_name: soa-called-ejb
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9990/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Web container with REST endpoints
  called-web:
    build:
      context: .
      dockerfile: called-web/Dockerfile
    ports:
      - '8444:8443'
      - '9990:9990'
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      JAVA_OPTS_APPEND: >
        -Djavax.net.ssl.trustStore=/opt/jboss/wildfly/standalone/configuration/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
    container_name: soa-called-web
    depends_on:
      called-ejb:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9990/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Mule ESB Integration Bus (SOAP Caller -> Called Service)
  mule-esb:
    build:
      dockerfile: mule-esb/Dockerfile
    ports:
      - '8082:8082'
    environment:
      MULE_ENV: docker
    container_name: soa-mule-esb
    depends_on:
      called-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # SOAP Caller Service (WildFly with JAX-WS)
  soap-caller:
    build:
      context: .
      dockerfile: soap-caller/Dockerfile
    ports:
      - '8083:8080'
      - '9993:9990'
    environment:
      MULE_ESB_HOST: mule-esb
      MULE_ESB_PORT: 8082
    container_name: soa-soap-caller
    depends_on:
      mule-esb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/jboss/wildfly/bin/jboss-cli.sh --connect --command=':read-attribute(name=server-state)' 2>/dev/null | grep -q running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # REST Adapter (Spring Cloud - replaces caller-service in infrastructure)
  rest-adapter:
    build: rest-adapter
    ports:
      - '8445:8080'
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SOAP_CALLER_URL: http://soap-caller:8080/soap/CallerServiceService
    container_name: soa-rest-adapter
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      soap-caller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/orgmanager/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Zuul API Gateway (routes via Eureka with Ribbon load balancing)
  zuul-gateway:
    build: zuul-gateway
    ports:
      - '8090:8080'
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    container_name: soa-zuul-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      rest-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: frontend
    ports:
      - '8448:443'
    container_name: soa-frontend
    depends_on:
      called-web:
        condition: service_healthy
      zuul-gateway:
        condition: service_healthy

  postgres:
    image: 'postgres:latest'
    environment:
      - 'PGPORT=5432'
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      - '5432:5432'
    container_name: soa-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - '8080:8080'
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi/openapi.yaml:ro
    container_name: soa-swagger-ui

volumes:
  postgresql-data:
