services:

  # Consul for Service Discovery
  consul:
    image: hashicorp/consul:1.15
    container_name: soa-consul
    ports:
      - '8500:8500'   # HTTP API / UI
      - '8600:8600/udp' # DNS
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0

  # EJB container with business logic
  called-ejb:
    build:
      context: .
      dockerfile: called-ejb/Dockerfile
    ports:
      - '8446:8443'
      - '9992:9990'
      - '8081:8080'
    environment:
      # EJB Pool Configuration - dynamically expandable
      EJB_POOL_MAX: ${EJB_POOL_MAX:-50}
      JAVA_OPTS_APPEND: >
        -Djavax.net.ssl.trustStore=/opt/jboss/wildfly/standalone/configuration/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
        -Dejb.pool.max=${EJB_POOL_MAX:-50}
    container_name: soa-called-ejb
    depends_on:
      - postgres
      - consul

  # Web container with REST endpoints
  called-web:
    build:
      context: .
      dockerfile: called-web/Dockerfile
    ports:
      - '8444:8443'
      - '9990:9990'
    environment:
      JAVA_OPTS_APPEND: >
        -Djavax.net.ssl.trustStore=/opt/jboss/wildfly/standalone/configuration/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
    container_name: soa-called-web
    depends_on:
      - called-ejb

  # Caller service (JAX-RS)
  jaxrs-wildfly:
    build: jax-rs
    ports:
      - '8445:8443'
      - '9991:9990'
    environment:
      JAVA_OPTS_APPEND: >
        -Djavax.net.ssl.trustStore=/opt/jboss/wildfly/standalone/configuration/truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
    container_name: soa-jaxrs-wildfly
    depends_on:
      - called-web

  frontend:
    build: frontend
    ports:
      - '8448:443'
    container_name: soa-frontend
    depends_on:
      - called-web
      - jaxrs-wildfly

  postgres:
    image: 'postgres:latest'
    environment:
      - 'PGPORT=5432'
      - 'POSTGRES_DB=postgres'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      - '5432:5432'
    container_name: soa-db

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - '8080:8080'
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi/openapi.yaml:ro
    container_name: soa-swagger-ui

volumes:
  postgresql-data:
