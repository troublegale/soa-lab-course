# Mule ESB Configuration

# HTTP Listener
http.port=8082

# Called Web (REST) - called-web WildFly
called.web.host=called-web
called.web.port=8443

# SOAP Service - soap-caller WildFly
soap.service.wsdl=http://soap-caller:8080/soap/CallerService?wsdl
soap.service.url=http://soap-caller:8080/soap/CallerService

# TLS/SSL
trust.store.path=/app/truststore.jks
trust.store.password=changeit
