openapi: 3.0.3
info:
  title: SOA Lab Course API

tags:
  - name: Organizations
    description: Операции с организациями (Spring Service)
  - name: Employees
    description: Операции с сотрудниками (Spring Service)
  - name: Additional Operations
    description: Дополнительные операции (JAX-RS Service)

paths:
  /soa/api/v1:
  /organizations:
    get:
      tags:
        - Organizations
      summary: Получить список всех организаций с пагинацией
      operationId: getAllOrganizations
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Номер страницы
        - name: size
          in: query
          schema:
            type: integer
            default: 20
          description: Размер страницы
      responses:
        '200':
          description: Список организаций
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationsPage'
        '400':
          description: Некорректные параметры запроса
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

    post:
      tags:
        - Organizations
      summary: Создать новую организацию
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '200':
          description: Созданная организация
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /organizations/query:
    post:
      tags:
        - Organizations
      summary: Получить организации с фильтрацией и сортировкой
      operationId: getFilteredOrganizations
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationQuery'
      responses:
        '200':
          description: Отфильтрованный список организаций
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationsPage'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /organizations/{id}:
    get:
      tags:
        - Organizations
      summary: Получить организацию по ID
      operationId: getOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Организация
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          description: Организация не найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

    put:
      tags:
        - Organizations
      summary: Обновить организацию
      operationId: updateOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '200':
          description: Обновлённая организация
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'
        '404':
          description: Организация не найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

    delete:
      tags:
        - Organizations
      summary: Удалить организацию
      operationId: deleteOrganization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Организация удалена
        '404':
          description: Организация не найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /organizations/{id}/employees:
    get:
      tags:
        - Organizations
      summary: Получить сотрудников организации
      operationId: getOrganizationEmployees
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Список сотрудников
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/EmployeesList'
        '404':
          description: Организация не найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /organizations/turnover:
    get:
      tags:
        - Organizations
      summary: Получить суммарный годовой оборот всех организаций
      operationId: getTotalTurnover
      responses:
        '200':
          description: Суммарный оборот
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/TurnoverResponse'

  /organizations/types:
    get:
      tags:
        - Organizations
      summary: Получить количество организаций по типам
      operationId: getOrganizationTypesCount
      responses:
        '200':
          description: Количество организаций по типам
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/TypeCountResponse'

  /organizations/lt-full-name:
    post:
      tags:
        - Organizations
      summary: Получить организации с fullName меньше заданного
      operationId: getOrganizationsLessThanFullName
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/FullNameValue'
      responses:
        '200':
          description: Список организаций
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OrganizationsPage'

  /organizations/compensate:
    post:
      tags:
        - Organizations
      summary: Компенсационная операция создания организации (для SAGA)
      operationId: compensateOrganization
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/OrganizationRequest'
      responses:
        '200':
          description: Созданная организация
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Organization'

  # ==================== SPRING SERVICE: Employees ====================
  /employees:
    post:
      tags:
        - Employees
      summary: Создать нового сотрудника
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Созданный сотрудник
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /employees/{id}:
    get:
      tags:
        - Employees
      summary: Получить сотрудника по ID
      operationId: getEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Сотрудник
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Сотрудник не найден
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

    put:
      tags:
        - Employees
      summary: Обновить сотрудника
      operationId: updateEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Обновлённый сотрудник
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'
        '404':
          description: Сотрудник не найден
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

    delete:
      tags:
        - Employees
      summary: Удалить сотрудника
      operationId: deleteEmployee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Сотрудник удалён
        '404':
          description: Сотрудник не найден
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /employees/batch/create:
    post:
      tags:
        - Employees
      summary: Массовое создание сотрудников
      operationId: createBatchEmployees
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/EmployeeRequestList'
      responses:
        '200':
          description: Список созданных сотрудников
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/EmployeesList'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /employees/batch/update:
    post:
      tags:
        - Employees
      summary: Массовое обновление сотрудников
      operationId: updateBatchEmployees
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/EmployeeRequestList'
      responses:
        '200':
          description: Список обновлённых сотрудников
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/EmployeesList'
        '400':
          description: Ошибка валидации
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /employees/batch/delete:
    post:
      tags:
        - Employees
      summary: Массовое удаление сотрудников
      operationId: deleteBatchEmployees
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/IdList'
      responses:
        '200':
          description: Сотрудники удалены

  /orgmanager/api/v1:
  # ==================== JAX-RS SERVICE: Additional Operations ====================
  /acquire/{acquirer-id}/{acquired-id}:
    post:
      tags:
        - Additional Operations
      summary: Поглощение одной организации другой
      description: |
        Переводит всех сотрудников из поглощаемой организации (acquired) 
        в организацию-поглотитель (acquirer), после чего удаляет поглощённую организацию.
      operationId: acquireOrganization
      parameters:
        - name: acquirer-id
          in: path
          required: true
          description: ID организации-поглотителя
          schema:
            type: integer
            format: int64
        - name: acquired-id
          in: path
          required: true
          description: ID поглощаемой организации
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Результат поглощения
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/Acquiring'
        '404':
          description: Одна из организаций не найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

  /fire/all/{id}:
    post:
      tags:
        - Additional Operations
      summary: Уволить всех сотрудников организации
      description: Удаляет всех сотрудников указанной организации
      operationId: fireAllOrgEmployees
      parameters:
        - name: id
          in: path
          required: true
          description: ID организации
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Количество уволенных сотрудников
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/FireResponse'
        '404':
          description: Организация не найдена
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/AppError'

components:
  schemas:
    # ==================== Entity Schemas ====================
    Organization:
      type: object
      xml:
        name: organization
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор организации
        name:
          type: string
          maxLength: 255
          description: Название организации
        creationDate:
          type: string
          format: date
          description: Дата создания организации
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          description: Годовой оборот
        fullName:
          type: string
          maxLength: 255
          description: Полное наименование организации
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        type:
          $ref: '#/components/schemas/OrganizationType'
        officialAddress:
          $ref: '#/components/schemas/Address'

    Employee:
      type: object
      xml:
        name: employee
      properties:
        id:
          type: integer
          format: int64
          description: Уникальный идентификатор сотрудника
        name:
          type: string
          maxLength: 128
          description: Имя сотрудника
        salary:
          type: integer
          format: int64
          minimum: 1
          description: Зарплата сотрудника
        organization:
          $ref: '#/components/schemas/Organization'

    Coordinates:
      type: object
      xml:
        name: coordinates
      required:
        - x
        - y
      properties:
        x:
          type: integer
          format: int64
          minimum: -826
          description: Координата X
        y:
          type: number
          format: float
          minimum: -143
          description: Координата Y

    Address:
      type: object
      xml:
        name: officialAddress
      required:
        - street
      properties:
        street:
          type: string
          maxLength: 147
          description: Улица
        town:
          $ref: '#/components/schemas/Location'

    Location:
      type: object
      xml:
        name: town
      required:
        - x
        - y
        - name
      properties:
        x:
          type: number
          format: float
          description: Координата X населённого пункта
        y:
          type: integer
          format: int64
          description: Координата Y населённого пункта
        name:
          type: string
          description: Название населённого пункта

    OrganizationType:
      type: string
      enum:
        - COMMERCIAL
        - GOVERNMENT
        - PRIVATE_LIMITED_COMPANY
        - OPEN_JOINT_STOCK_COMPANY
      description: Тип организации

    # ==================== Request Schemas ====================
    OrganizationRequest:
      type: object
      xml:
        name: organizationRequest
      required:
        - name
        - coordinates
        - annualTurnover
        - type
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: ID организации (для обновления)
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название организации
        creationDate:
          type: string
          format: date
          description: Дата создания организации
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        annualTurnover:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          description: Годовой оборот (положительное число)
        fullName:
          type: string
          maxLength: 255
          pattern: '^(?!\s*$).+'
          description: Полное наименование (не может быть пустой строкой)
        type:
          $ref: '#/components/schemas/OrganizationType'
        officialAddress:
          $ref: '#/components/schemas/Address'

    EmployeeRequest:
      type: object
      xml:
        name: employeeRequest
      required:
        - name
        - salary
        - organizationId
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: ID сотрудника (для обновления)
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Имя сотрудника
        salary:
          type: integer
          format: int64
          minimum: 1
          description: Зарплата (положительное число)
        organizationId:
          type: integer
          format: int64
          description: ID организации сотрудника

    EmployeeRequestList:
      type: array
      xml:
        name: list
        wrapped: true
      items:
        $ref: '#/components/schemas/EmployeeRequest'

    IdList:
      type: array
      xml:
        name: list
        wrapped: true
      items:
        type: integer
        format: int64

    # ==================== Response Schemas ====================
    OrganizationsPage:
      type: object
      xml:
        name: organizationsPage
      properties:
        organizations:
          type: array
          xml:
            name: organizations
            wrapped: true
          items:
            $ref: '#/components/schemas/Organization'
        page:
          type: integer
          description: Текущая страница
        size:
          type: integer
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        totalPages:
          type: integer
          description: Общее количество страниц

    EmployeesList:
      type: object
      xml:
        name: employees
      properties:
        employees:
          type: array
          xml:
            wrapped: false
          items:
            $ref: '#/components/schemas/Employee'

    TurnoverResponse:
      type: object
      xml:
        name: turnoverResponse
      properties:
        totalTurnover:
          type: number
          format: double
          description: Суммарный годовой оборот
        organizationCount:
          type: integer
          description: Количество организаций

    TypeCountResponse:
      type: object
      xml:
        name: typeCounts
      properties:
        types:
          type: array
          xml:
            wrapped: false
          items:
            $ref: '#/components/schemas/TypeCount'

    TypeCount:
      type: object
      xml:
        name: typeCount
      properties:
        type:
          $ref: '#/components/schemas/OrganizationType'
        count:
          type: integer
          description: Количество организаций данного типа

    FullNameValue:
      type: object
      xml:
        name: fullNameValue
      properties:
        value:
          type: string
          description: Значение fullName для сравнения

    # ==================== JAX-RS Response Schemas ====================
    Acquiring:
      type: object
      xml:
        name: acquiring
      properties:
        acquirerOrganization:
          $ref: '#/components/schemas/Organization'
          description: Организация-поглотитель
        acquiredOrganization:
          $ref: '#/components/schemas/Organization'
          description: Поглощённая организация
        numberOfEmployeesMoved:
          type: integer
          description: Количество перемещённых сотрудников

    FireResponse:
      type: object
      xml:
        name: employeeCount
      properties:
        employeeCount:
          type: integer
          description: Количество уволенных сотрудников

    # ==================== Error Schema ====================
    AppError:
      type: object
      xml:
        name: appError
      properties:
        code:
          type: integer
          description: Код ошибки
        message:
          type: string
          description: Сообщение об ошибке

    # ==================== Filter Schemas (for OrganizationQuery) ====================
    OrganizationQuery:
      type: object
      xml:
        name: organizationQuery
      properties:
        sort:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Список полей для сортировки. 
            Формат: "fieldName" или "-fieldName" (для сортировки по убыванию)
          example:
            - "name"
            - "-creationDate"
        idFilter:
          $ref: '#/components/schemas/NumberFilterLong'
        nameFilter:
          $ref: '#/components/schemas/StringFilter'
        coordinatesFilter:
          $ref: '#/components/schemas/CoordinatesFilter'
        creationDateFilter:
          $ref: '#/components/schemas/DateFilter'
        annualTurnoverFilter:
          $ref: '#/components/schemas/NumberFilterFloat'
        fullNameFilter:
          $ref: '#/components/schemas/StringFilter'
        typeFilter:
          $ref: '#/components/schemas/TypeFilter'
        officialAddressFilter:
          $ref: '#/components/schemas/AddressFilter'

    NumberFilterLong:
      type: object
      xml:
        name: numberFilter
      description: Фильтр для числовых полей (Long)
      properties:
        eq:
          type: integer
          format: int64
          description: Равно
        gt:
          type: integer
          format: int64
          description: Больше
        ge:
          type: integer
          format: int64
          description: Больше или равно
        lt:
          type: integer
          format: int64
          description: Меньше
        le:
          type: integer
          format: int64
          description: Меньше или равно

    NumberFilterFloat:
      type: object
      xml:
        name: numberFilter
      description: Фильтр для числовых полей (Float)
      properties:
        eq:
          type: number
          format: float
          description: Равно
        gt:
          type: number
          format: float
          description: Больше
        ge:
          type: number
          format: float
          description: Больше или равно
        lt:
          type: number
          format: float
          description: Меньше
        le:
          type: number
          format: float
          description: Меньше или равно

    StringFilter:
      type: object
      xml:
        name: stringFilter
      description: Фильтр для строковых полей
      properties:
        eq:
          type: string
          description: Точное совпадение
        contains:
          type: string
          description: Содержит подстроку
        startsWith:
          type: string
          description: Начинается с
        endsWith:
          type: string
          description: Заканчивается на

    DateFilter:
      type: object
      xml:
        name: dateFilter
      description: Фильтр для полей с датой
      properties:
        eq:
          type: string
          format: date
          description: Равно дате
        before:
          type: string
          format: date
          description: До указанной даты
        after:
          type: string
